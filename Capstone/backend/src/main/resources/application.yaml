ktor:
  deployment:
    port: 8080
# configured for server to use routes
  application:
    modules:
      - com.utahfoodbank.SerializationKt.configureSerialization
      - com.utahfoodbank.CorsKt.configureCors
      - com.utahfoodbank.routes.ClientRoutesKt.configureRouting
      - com.utahfoodbank.routes.DispatcherRoutesKt.configureDispatcherRoutes
      - com.utahfoodbank.routes.DriverRouteKt.configureDriverRoute
      - com.utahfoodbank.routes.RouteRoutesKt.configureRoutes
      - com.utahfoodbank.routes.DeliveryRoutesKt.configureDeliveryRoutes